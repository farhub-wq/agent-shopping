# §10 阈值告警规则。severity 分级：P0 资金/超卖/验签/卡死；P1 失败率/延迟/积压；P2 次日处理。
# 计数型「>0 立即」用 increase()[5m] 表达，既保留「新出现即告警」语义，又避免计数器永不回退导致告警永久粘滞。

groups:
  - name: p0-critical
    rules:
      # 验签失败：伪造/无效回调的前置信号，出现即 P0
      - alert: PaymentCallbackVerificationFailed
        expr: increase(payment_callback_total{result="verification_failed"}[5m]) > 0
        for: 0s
        labels: { severity: P0 }
        annotations:
          summary: "支付回调验签失败"
          description: "近 5 分钟出现 {{ $value }} 次验签失败回调，疑似伪造或密钥泄漏，立即核查渠道密钥。"
          runbook: docs/RUNBOOK.md

      # 订单卡死：超过支付窗口仍 PAYING 或超过 5 分钟仍 RESERVED
      - alert: OrderStuck
        expr: order_stuck_total > 0
        for: 0s
        labels: { severity: P0 }
        annotations:
          summary: "存在卡死订单（{{ $labels.service }}）"
          description: "{{ $labels.service }} 检出 {{ $value }} 笔 RESERVED/PAYING 超时订单，补偿扫单已介入，需确认是否持续新增。"
          runbook: docs/RUNBOOK.md

      # 库存扣减不足：超卖/超买的前置信号
      - alert: InventoryNegative
        expr: increase(inventory_negative_total[5m]) > 0
        for: 0s
        labels: { severity: P0 }
        annotations:
          summary: "库存扣减不足（{{ $labels.service }}）"
          description: "近 5 分钟出现 {{ $value }} 次扣减不足，检查 Redis 热点库存与 DB 是否漂移。"
          runbook: docs/RUNBOOK.md

      # 总账借贷不平：资金系统最强不变量被破坏
      - alert: LedgerImbalance
        expr: increase(ledger_imbalance_total[5m]) > 0
        for: 0s
        labels: { severity: P0 }
        annotations:
          summary: "总账借贷不平（{{ $labels.service }}）"
          description: "近 5 分钟出现 {{ $value }} 次借贷不平写入被拒，立即排查分录构造逻辑。"
          runbook: docs/RUNBOOK.md

  - name: p1-operational
    rules:
      # 5xx 错误率 >1% 持续 5 分钟
      - alert: High5xxRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
            / clamp_min(sum(rate(http_requests_total[5m])) by (service), 0.0001) > 0.01
        for: 5m
        labels: { severity: P1 }
        annotations:
          summary: "{{ $labels.service }} 5xx 错误率超 1%"
          description: "{{ $labels.service }} 近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}。"
          runbook: docs/RUNBOOK.md

      # 下单 P95 时延 >800ms 持续 10 分钟（order 服务 POST 请求）
      - alert: CheckoutLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{service="order", method="POST"}[10m]))
          ) > 0.8
        for: 10m
        labels: { severity: P1 }
        annotations:
          summary: "下单 P95 时延超 800ms"
          description: "order 服务下单 P95 时延 {{ $value | humanizeDuration }}。"
          runbook: docs/RUNBOOK.md

      # 下单失败率 >5% 持续 5 分钟
      - alert: CheckoutFailureRateHigh
        expr: |
          sum(rate(checkout_total{result!="success"}[5m])) by (service)
            / clamp_min(sum(rate(checkout_total[5m])) by (service), 0.0001) > 0.05
        for: 5m
        labels: { severity: P1 }
        annotations:
          summary: "下单失败率超 5%"
          description: "{{ $labels.service }} 近 5 分钟下单失败率 {{ $value | humanizePercentage }}。"
          runbook: docs/RUNBOOK.md

      # outbox 投递延迟 >10s 持续 2 分钟
      - alert: OutboxLagHigh
        expr: outbox_lag_seconds > 10
        for: 2m
        labels: { severity: P1 }
        annotations:
          summary: "Outbox 投递延迟超 10s（{{ $labels.service }}）"
          description: "{{ $labels.service }} 最老未投递事件已积压 {{ $value }}s，检查消费者与 relay 锁。"
          runbook: docs/RUNBOOK.md

      # 连接池耗尽 >0 持续 5 分钟
      - alert: DbPoolExhausted
        expr: increase(db_pool_exhausted_total[5m]) > 0
        for: 5m
        labels: { severity: P1 }
        annotations:
          summary: "连接池耗尽（{{ $labels.service }}）"
          description: "{{ $labels.service }} 近 5 分钟连接池耗尽 {{ $value }} 次，检查 pool_size 与慢查询。"
          runbook: docs/RUNBOOK.md

      # Agent 工具被策略拒绝：5 分钟 >10 次，疑似越权试探
      - alert: AgentToolDeniedBurst
        expr: increase(agent_tool_denied_total[5m]) > 10
        for: 5m
        labels: { severity: P1 }
        annotations:
          summary: "Agent 工具拒绝次数异常（{{ $labels.service }}）"
          description: "近 5 分钟被策略拒绝 {{ $value }} 次，核查是否存在越权试探。"
          runbook: docs/RUNBOOK.md

      # 沙箱 runner 抓取失败：目标不在线或端口未监听。
      # 专用节点部署时 instance 标签是节点私网地址，需同步改成实际抓取目标。
      - alert: SandboxRunnerDown
        expr: up{instance="sandbox-runner:8000"} == 0
        for: 2m
        labels: { severity: P1 }
        annotations:
          summary: "沙箱 runner 不可用"
          description: "连续 2 分钟抓取不到 sandbox-runner:8000，沙箱执行已 fail-closed 拒绝，检查 runner 容器与节点。"
          runbook: docs/RUNBOOK.md

      # healthz 判死：隔离退化、节点混部、镜像未固定等，均代表安全基线被破坏。
      # healthz 被 RED 中间件排除，靠 runner 自己写的 gauge 暴露；由 healthcheck 每 30s 刷新。
      - alert: SandboxHealthDegraded
        expr: sandbox_runner_healthy{service="sandbox-runner"} == 0
        for: 2m
        labels: { severity: P1 }
        annotations:
          summary: "沙箱隔离基线异常"
          description: "runner healthz 连续 2 分钟返回 503，检查 SANDBOX_RUNTIME、节点混部、镜像 digest 与 Redis 凭据。"
          runbook: docs/RUNBOOK.md

      # 执行直接不可用：去重存储故障、并发闸门繁忙、同一执行仍在进行。
      # 这类返回没有真正启动容器（fail-closed），出现即说明容量或依赖异常。
      - alert: SandboxExecutionUnavailable
        expr: increase(sandbox_executions_total{service="sandbox-runner", result="unavailable"}[5m]) > 0
        for: 2m
        labels: { severity: P1 }
        annotations:
          summary: "沙箱执行返回不可用"
          description: "近 5 分钟出现 {{ $value }} 次 unavailable，优先检查 runner Redis 与并发闸门。"
          runbook: docs/RUNBOOK.md

  - name: p2-daily
    rules:
      # 日终对账开放差异 >0：次日处理进日报
      - alert: ReconciliationDiff
        expr: reconciliation_diff_total > 0
        for: 0s
        labels: { severity: P2 }
        annotations:
          summary: "日终对账存在差异（{{ $labels.service }}）"
          description: "对账检出 {{ $value }} 条开放差异，次日人工核查渠道账单。"
          runbook: docs/RUNBOOK.md

      # 基础设施型执行失败：容器未启动或运行时不可用，不是用户代码本身报错
      - alert: SandboxInfraError
        expr: increase(sandbox_executions_total{service="sandbox-runner", result="infra_error"}[10m]) > 0
        for: 5m
        labels: { severity: P2 }
        annotations:
          summary: "沙箱基础设施执行失败"
          description: "近 10 分钟出现 {{ $value }} 次 infra_error，检查 Docker/runsc、镜像与节点磁盘。"
          runbook: docs/RUNBOOK.md

      # 并发饱和：阈值对应默认 SANDBOX_MAX_CONCURRENCY=4，调整配置时同步修改
      - alert: SandboxConcurrencySaturated
        expr: http_requests_in_flight{service="sandbox-runner"} >= 4
        for: 5m
        labels: { severity: P2 }
        annotations:
          summary: "沙箱并发持续饱和"
          description: "runner 在途执行连续 5 分钟达到 4（默认上限），后续请求会返回繁忙，评估扩容或错峰。"
          runbook: docs/RUNBOOK.md
