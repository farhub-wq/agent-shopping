name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 代码规范
        run: ruff check packages services tests .github/scripts
      - name: 脚本语法
        run: python -m py_compile .github/scripts/ai_review.py
      - name: 单元测试
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        working-directory: web
        run: npm ci
      - name: 类型检查与构建
        working-directory: web
        run: npm run build

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验编排
        run: docker compose -f docker-compose.yml config -q

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    if: always()
    steps:
      - name: 汇总结果
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.compose.result }}" != "success" ]; then
            echo "CI 未通过"
            exit 1
          fi
          echo "CI 全部通过"
