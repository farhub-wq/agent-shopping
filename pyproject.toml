[project]
name = "shop-agent"
version = "0.1.0"
description = "Harness-driven e-commerce reference system: microservices + agent control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiomysql>=0.2.0",
  # MySQL 8 默认 caching_sha2_password，aiomysql 认证需要 cryptography
  "cryptography>=42.0.0",
  "aiosqlite>=0.20.0",
  "motor>=3.6.0",
  "redis>=5.0.8",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "pyjwt>=2.8.0",
  "numpy>=1.26.0",
  "docker>=7.1.0",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["packages", "services"]
include = ["shop_common*", "gateway*", "catalog*", "inventory*", "order*", "fulfillment*", "aftersales*", "harness*", "identity*", "payment*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "packages", "services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
