name: shop-agent

x-service-env: &service-env
  REDIS_URL: redis://redis:6379/0
  # 禁止匿名 Redis：default 用户由 ACL 设密码，业务服务用该密码认证
  REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
  # 本地开发默认信任网关签名的身份头；生产 overlay 里会关掉
  INTERNAL_SIGNING_SECRET: ${INTERNAL_SIGNING_SECRET:-dev-internal-signing-secret}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-0y5-6ym0zsmuIEBUg5OL133pRODLkiRFpQhgbIVZWmU=}
  TRUST_IDENTITY_HEADERS: ${TRUST_IDENTITY_HEADERS:-true}
  AUTH_DEV_MODE: ${AUTH_DEV_MODE:-false}
  ENV: ${ENV:-dev}
  INVENTORY_URL: http://inventory:8000
  CATALOG_URL: http://catalog:8000
  ORDER_URL: http://order:8000
  FULFILLMENT_URL: http://fulfillment:8000
  AFTERSALES_URL: http://aftersales:8000
  GATEWAY_URL: http://gateway:8000
  HARNESS_URL: http://harness:8000
  IDENTITY_URL: http://identity:8000
  PAYMENT_URL: http://payment:8000
  AUDIT_URL: http://audit:8000
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-256}
  # 与 build_embedder 的判定对齐：这两个变量齐备才会启用真实嵌入，容器内不挂载 .env
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-15}

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shop-root}
      MYSQL_USER: ${MYSQL_USER:-shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shop}
      # 建库与授权在 init.sql 里统一完成，这里不设 MYSQL_DATABASE，避免只授权一个库
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysqldata:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD:-shop-root} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongo:
    image: mongo:7.0
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/00-init.js:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    environment:
      # default 用户只给业务服务用，必须带密码；runner 拿不到这个密码，只能走受限用户。
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      # 受限 ACL 用户只用于 sandbox-runner；密码由 .env 注入，不写进镜像或仓库。
      SANDBOX_REDIS_PASSWORD: ${SANDBOX_REDIS_PASSWORD:-dev-sandbox-redis-password}
    # 启动时从模板生成 ACL 文件，再带 --aclfile 启动，确保 runner 只能碰沙箱键。
    entrypoint: ["/bin/sh", "/etc/redis/entrypoint.sh"]
    volumes:
      - ./infra/redis/entrypoint.sh:/etc/redis/entrypoint.sh:ro
      - ./infra/redis/users.acl.template:/etc/redis/users.acl.template:ro
    ports:
      - "6379:6379"
    healthcheck:
      # default 用户已设密码，健康检查必须带认证；$$ 由 compose 转义为容器内变量。
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 20

  catalog:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: catalog } }
    environment:
      <<: *service-env
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-shop}:${MYSQL_PASSWORD:-shop}@mysql:3306/catalog_db?charset=utf8mb4
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8001:8000"]
    healthcheck: &healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  inventory:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: inventory } }
    environment:
      <<: *service-env
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-shop}:${MYSQL_PASSWORD:-shop}@mysql:3306/inventory_db?charset=utf8mb4
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8002:8000"]
    healthcheck: *healthcheck

  order:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: order } }
    environment:
      <<: *service-env
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-shop}:${MYSQL_PASSWORD:-shop}@mysql:3306/order_db?charset=utf8mb4
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8003:8000"]
    healthcheck: *healthcheck

  fulfillment:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: fulfillment } }
    environment:
      <<: *service-env
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-shop}:${MYSQL_PASSWORD:-shop}@mysql:3306/fulfillment_db?charset=utf8mb4
      ORDER_URL: http://order:8000
      FULFILLMENT_SLA_HOURS: ${FULFILLMENT_SLA_HOURS:-48}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8004:8000"]
    healthcheck: *healthcheck

  aftersales:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: aftersales } }
    environment:
      <<: *service-env
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-shop}:${MYSQL_PASSWORD:-shop}@mysql:3306/aftersales_db?charset=utf8mb4
      REFUND_WINDOW_DAYS: ${REFUND_WINDOW_DAYS:-7}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8005:8000"]
    healthcheck: *healthcheck

  sandbox-runner:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: sandbox_runner } }
    environment:
      # runner 只做一件事：执行沙箱容器。不注入数据库/Redis/业务服务地址，缩小被攻破后的影响面。
      # 不注入 JWT_SECRET / INTERNAL_SIGNING_SECRET：runner 只认专用签名密钥，
      # 前端令牌或网关内网密钥泄露都不等于能执行沙箱代码。
      RUNNER_SIGNING_SECRET: ${RUNNER_SIGNING_SECRET:-dev-runner-signing-secret}
      TRUST_IDENTITY_HEADERS: ${TRUST_IDENTITY_HEADERS:-true}
      ENV: ${ENV:-dev}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-shop-agent-sandbox:latest}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-20}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-256}
      SANDBOX_CPU: ${SANDBOX_CPU:-0.5}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-none}
      SANDBOX_MAX_CONCURRENCY: ${SANDBOX_MAX_CONCURRENCY:-4}
      SANDBOX_QUEUE_TIMEOUT_SECONDS: ${SANDBOX_QUEUE_TIMEOUT_SECONDS:-10}
      # Docker 端点：留空走默认 socket（本地开发）；生产由 prod overlay 指向 rootless socket
      SANDBOX_DOCKER_HOST: ${SANDBOX_DOCKER_HOST:-}
      # 容器运行时：留空走 runc（本地开发）；生产强制 runsc（gVisor）
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      # 隔离档位：rootless（同机 rootless dockerd）或 dedicated（专用节点 rootful dockerd）
      SANDBOX_ISOLATION_MODE: ${SANDBOX_ISOLATION_MODE:-rootless}
      # 跨 runner 的执行去重靠 Redis 共享状态；使用受限 ACL 用户，
      # 只允许 sandbox:exec:* 与审计流，不注入业务共享 REDIS_URL。
      SANDBOX_REDIS_URL: redis://sandbox-runner:${SANDBOX_REDIS_PASSWORD:-dev-sandbox-redis-password}@redis:6379/0
      SANDBOX_DEDUPE_WAIT_SECONDS: ${SANDBOX_DEDUPE_WAIT_SECONDS:-5}
    volumes:
      # 全系统唯一持有 Docker socket 的组件；不映射宿主端口、不经 gateway 暴露。
      # 宿主侧 socket 路径可覆盖：生产指向 rootless dockerd 的 socket（见 prod overlay）。
      - ${SANDBOX_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    labels:
      # 专用节点独占校验靠该标签识别 runner 自身，不被判成业务容器。
      shop.sandbox.role: runner
    depends_on:
      redis: { condition: service_healthy }
    healthcheck: *healthcheck

  harness:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: harness } }
    environment:
      <<: *service-env
      # Harness 的记忆与轨迹存 Mongo，不再需要关系库
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-shop_harness}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      # harness 自身不接触 Docker：启用沙箱后只经内网调用 runner。
      # 专用节点部署时用 .env 覆盖为节点私网地址；多主机用逗号分隔全部 runner。
      SANDBOX_RUNNER_URLS: ${SANDBOX_RUNNER_URLS:-http://sandbox-runner:8000}
      # harness 调用 runner 使用 runner 专用签名密钥，与业务内网签名密钥分开
      RUNNER_SIGNING_SECRET: ${RUNNER_SIGNING_SECRET:-dev-runner-signing-secret}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-shop-agent-sandbox:latest}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-20}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-256}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      inventory: { condition: service_healthy }
      order: { condition: service_healthy }
      catalog: { condition: service_healthy }
      # runner 是否可用由 harness 的 /sandbox/health 实时探测；这里只保证容器先启动
      sandbox-runner: { condition: service_started }
    ports: ["8006:8000"]
    healthcheck: *healthcheck

  identity:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: identity } }
    environment:
      <<: *service-env
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-shop}:${MYSQL_PASSWORD:-shop}@mysql:3306/identity_db?charset=utf8mb4
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8007:8000"]
    healthcheck: *healthcheck

  payment:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: payment } }
    environment:
      <<: *service-env
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-shop}:${MYSQL_PASSWORD:-shop}@mysql:3306/payment_db?charset=utf8mb4
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-payment-webhook-secret}
      PAYMENT_MOCK_MODE: ${PAYMENT_MOCK_MODE:-true}
      PAYMENT_TTL_SECONDS: ${PAYMENT_TTL_SECONDS:-900}
      PAYMENT_FEE_BPS: ${PAYMENT_FEE_BPS:-60}
      # 收银台 pay_url 必须是浏览器可访问的网关地址，不能写容器内域名
      PAYMENT_PUBLIC_BASE_URL: ${PAYMENT_PUBLIC_BASE_URL:-http://localhost:8080}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8008:8000"]
    healthcheck: *healthcheck

  audit:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: audit } }
    environment:
      <<: *service-env
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-shop}:${MYSQL_PASSWORD:-shop}@mysql:3306/audit_db?charset=utf8mb4
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8009:8000"]
    healthcheck: *healthcheck

  gateway:
    build: { context: ., dockerfile: infra/Dockerfile, args: { SERVICE_NAME: gateway } }
    environment:
      <<: *service-env
      SERVICE_NAME: gateway
    depends_on:
      catalog: { condition: service_healthy }
      inventory: { condition: service_healthy }
      order: { condition: service_healthy }
      fulfillment: { condition: service_healthy }
      aftersales: { condition: service_healthy }
      payment: { condition: service_healthy }
      harness: { condition: service_healthy }
      identity: { condition: service_healthy }
      audit: { condition: service_healthy }
    ports: ["8080:8000"]
    healthcheck: *healthcheck

  web:
    build: { context: ./web }
    depends_on:
      gateway: { condition: service_healthy }
    ports: ["5173:80"]

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # 初始管理员密码：生产必须通过 .env 注入强口令，禁止默认值上线
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on:
      prometheus: { condition: service_started }

volumes:
  mysqldata:
  mongodata:
  prometheusdata:
  grafanadata:
